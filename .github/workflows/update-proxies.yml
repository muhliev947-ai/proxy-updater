name: Update Proxies

on:
  schedule:
    - cron: '0 * * * *'  # Запуск каждый час
  workflow_dispatch:      # Кнопка для ручного запуска

jobs:
  update-proxies:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Make script executable
        run: chmod +x update-proxies.sh
      
      - name: Run proxy updater
        run: ./update-proxies.sh
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proxies.txt || true
          git diff --staged --quiet || git commit -m "🔄 Auto-update proxies [$(date +'%Y-%m-%d %H:%M:%S')]"
          git push || true
