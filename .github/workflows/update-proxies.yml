name: Update Proxies

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x update-proxies.sh

      - name: Run proxy updater
        run: ./update-proxies.sh

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Добавляем файл с прокси (даже если его нет, ошибки не будет)
          git add proxies.txt || true
          # Если есть изменения — сохраняем, если нет — просто выходим
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update proxies"
            git push
          else
            echo "No changes to commit"
          fi
